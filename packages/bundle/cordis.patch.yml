# deepseek-harness-UI 组合层：插入 ide 插件行。
# 行 id 固定（deepseek-harness-ui / deepseek-harness-ui-client），
# 后应用的层可按 id 覆盖；成员可在 profile 自己的 cordis.patch.yml 覆盖。
- insert:
    - id: deepseek-harness-ui
      name: '@deepseek-ai/dsh-ide'
    - id: deepseek-harness-ui-client
      name: '@deepseek-ai/dsh-client-ui-ide'
