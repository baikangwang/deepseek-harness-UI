# release.yml - generated by dsh-release (do not edit manually)
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env: visible to step `if` conditions.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./packages/ide/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Typecheck
        run: "pnpm typecheck"

      - name: Build
        run: "pnpm build"

      - name: npm pack
        run: |
          mkdir -p dist
          (cd "$GITHUB_WORKSPACE/packages/ide" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          ls -la dist/

      - name: Assemble offline installer zip
        shell: pwsh
        run: |
          ./scripts/build-offline-package.ps1
          Get-ChildItem dist | Select-Object Name, Length

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz dist/*-offline-*.zip --repo "${{ github.repository }}" --clobber
            echo "Release $TAG updated with artifacts."
          else
            gh release create "$TAG" dist/*.tgz dist/*-offline-*.zip --repo "${{ github.repository }}" --title "$TAG" --notes "dsh package $TAG — 预编译包（.tgz）与无编译环境安装包（-offline-.zip）。"
            echo "Release $TAG created."
          fi
