# release.yml - automated package release for dsh-ide-ui, gated by approval.
#
# Pipeline:
#   push master (or manual Run workflow)  ->  build job runs automatically
#     (install + typecheck + build + emit version)  -- NO publishing happens
#   publish job waits for HUMAN APPROVAL on the `release` environment
#     (Settings -> Environments -> release -> Required reviewers)
#     -> on approve: npm pack + offline zip + auto-tag v<semver> (if absent)
#        + GitHub Release with both artifacts + optional npm publish.
#
# So every push is built and packaged automatically, but nothing is released
# (no tag, no Release, no npm) until you approve in the Actions UI.
#
# Tag triggers still route through the same approval gate: push a tag v* only
# when you want to re-release an existing version.
#
# The auto-created tag uses the GITHUB_TOKEN, whose pushes do NOT re-trigger
# workflows, so there is no infinite loop.
#
# Secrets:
#   NPM_TOKEN  (optional) npm registry auth token for `npm publish`. Without
#              it the workflow still builds the artifacts and the Release.

name: release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout
        # v5: Node 24 runner (v4 targets Node 20, deprecated 2025-09)
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # must match the version that wrote pnpm-lock.yaml (lockfile v9.0, pnpm 11)
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (tsdown)
        run: pnpm build

      - name: Emit package version
        id: pkg
        run: |
          PKG_VERSION="$(node -p "require('./packages/ide/package.json').version")"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package.json version: ${PKG_VERSION}"

      - name: Assert tag matches package.json version (tag triggers only)
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag version: ${TAG_VERSION}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag (${TAG_VERSION}) != package.json version (${PKG_VERSION}). Bump packages/ide/package.json first, then re-tag."
            exit 1
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Human gate: the job waits for approval from the `release` environment's
    # required reviewers before ANY of these steps run.
    environment: release
    # Job-level env: visible to step `if` conditions (step env is not), and
    # secrets may not be referenced directly inside `if` expressions.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm pack
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          echo "Releasing version: ${VERSION}"
          mkdir -p dist
          (cd packages/ide && npm pack --pack-destination ../../dist)
          ls -la dist/

      - name: Assemble offline installer zip
        shell: pwsh
        run: |
          ./scripts/build-offline-package.ps1
          Get-ChildItem dist | Select-Object Name, Length

      - name: Auto-tag v<version> (create + push if absent)
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — skipping creation."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed tag ${TAG}."
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${TAG}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz dist/*-offline-*.zip \
              --repo "${{ github.repository }}" --clobber
            echo "Release ${TAG} updated with artifacts."
          else
            gh release create "$TAG" dist/*.tgz dist/*-offline-*.zip \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "dsh-ide-ui ${TAG} — 预编译插件包（.tgz）与无编译环境安装包（-offline-.zip）。
                    安装见 docs/deployment.md：解压 zip → 运行 install-dsh-ide-ui.ps1 → 重启 dsh web。"
            echo "Release ${TAG} created."
          fi

      - name: Publish to npm (optional, needs NPM_TOKEN)
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd packages/ide
          npm publish --access public
